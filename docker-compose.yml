services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: escoligest
      POSTGRES_USER: escoligest
      POSTGRES_PASSWORD: escolitest
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build: ./backend
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      - DATABASE_NAME=escoligest
      - DATABASE_USER=escoligest
      - DATABASE_PASSWORD=escolitest
      - DATABASE_HOST=db
      - DATABASE_PORT=5432
      - EMAIL_BACKEND=${EMAIL_BACKEND:-django.core.mail.backends.console.EmailBackend}
      - EMAIL_HOST=${EMAIL_HOST:-smtp.sendgrid.net}
      - EMAIL_PORT=${EMAIL_PORT:-587}
      - EMAIL_HOST_USER=${EMAIL_HOST_USER:-apikey}
      - EMAIL_HOST_PASSWORD=${EMAIL_HOST_PASSWORD:-}
      - EMAIL_USE_TLS=${EMAIL_USE_TLS:-True}
      - EMAIL_USE_SSL=${EMAIL_USE_SSL:-False}
      - DEFAULT_FROM_EMAIL=${DEFAULT_FROM_EMAIL:-no-reply@escoligest.local}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:4200}
    depends_on:
      - db

volumes:
  pgdata:
